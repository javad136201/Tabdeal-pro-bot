<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabdeal Pro</title><style>body{font-family:Tahoma;background:#10151d;color:white;padding:16px}.card{max-width:650px;margin:auto;background:#1b2430;border-radius:18px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#263140;padding:14px;border-radius:12px}.v{font-size:20px;margin-top:6px}</style></head><body><div class="card"><h2>Tabdeal Pro Bot v1.2.1</h2><div id="st">در حال اتصال...</div><div class="grid"><div class="item">بازار<div class="v" id="sy">-</div></div><div class="item">حالت<div class="v" id="mo">-</div></div><div class="item">سیگنال<div class="v" id="sg">-</div></div><div class="item">اعتماد<div class="v" id="co">-</div></div><div class="item">قیمت<div class="v" id="pr">-</div></div><div class="item">RSI<div class="v" id="rs">-</div></div></div><p id="re"></p></div><script>async function load(){try{let s=await fetch('/api/status').then(r=>r.json()),a=await fetch('/api/analysis').then(r=>r.json());sy.textContent=s.symbol;mo.textContent=s.mode;sg.textContent=a.signal||'-';co.textContent=(a.confidence??0)+'%';pr.textContent=a.price??'-';rs.textContent=a.rsi??'-';re.textContent='دلایل: '+(a.reason||'-')+(a.error?' | خطا: '+a.error:'');st.textContent='● متصل | نسخه '+s.version}catch(e){st.textContent='● خطا در اتصال'}}load();setInterval(load,10000)</script></body></html>
