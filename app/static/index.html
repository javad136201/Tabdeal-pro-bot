<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabdeal Pro</title>
<style>body{font-family:Tahoma;background:#10161f;color:#eee;margin:0}.w{max-width:950px;margin:auto;padding:14px}.c{background:#1b2430;border:1px solid #303b49;border-radius:16px;padding:15px;margin:12px 0}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.s{background:#25303d;padding:12px;border-radius:11px}.l{font-size:12px;color:#aeb9c6}.v{font-size:20px;font-weight:bold;margin-top:6px}.sig{font-size:34px;font-weight:bold}.buy{color:#65d38a}.sell{color:#ff7b7b}.hold{color:#ffd36a}button{padding:12px 16px;border:0;border-radius:10px;margin:4px;font-weight:bold;cursor:pointer}.p{background:#4c8df6;color:#fff}.d{background:#d95757;color:#fff}.n{background:#344151;color:#fff}table{width:100%;font-size:12px}td,th{padding:7px;border-bottom:1px solid #303b49;text-align:right}@media(max-width:650px){.g{grid-template-columns:repeat(2,1fr)}}</style>
<div class=w><div class=c><h2>🤖 Tabdeal Pro</h2><div class=l>داشبورد فارسی — حالت DEMO</div></div>
<div class=c><div class=l>سیگنال فعلی</div><div id=sig class="sig hold">HOLD</div><div id=reason class=l>-</div></div>
<div class=c><h3>وضعیت معامله</h3><div class=g>
<div class=s>وضعیت<div id=pos class=v>-</div></div><div class=s>قیمت فعلی<div id=price class=v>-</div></div><div class=s>قیمت ورود<div id=entry class=v>-</div></div><div class=s>سود/زیان<div id=pnl class=v>-</div></div>
<div class=s>حد سود<div id=tp class=v>-</div></div><div class=s>حد ضرر<div id=sl class=v>-</div></div><div class=s>سرمایه<div id=eq class=v>-</div></div><div class=s>کارمزد<div id=fee class=v>-</div></div></div></div>
<div class=c><h3>کنترل معامله</h3><button class=p onclick=tick()>اجرای Demo</button><button class=d onclick=closeM()>بستن دستی</button><button class=n onclick=resetD()>شروع مجدد</button><div id=msg class=l></div></div>
<div class=c><h3>تحلیل بازار</h3><div class=g><div class=s>اعتماد<div id=conf class=v>-</div></div><div class=s>RSI<div id=rsi class=v>-</div></div><div class=s>EMA20<div id=e20 class=v>-</div></div><div class=s>EMA50<div id=e50 class=v>-</div></div></div></div>
<div class=c><h3>تاریخچه معاملات</h3><div id=hist>هنوز معامله‌ای نیست.</div></div></div>
<script>
const $=x=>document.getElementById(x), f=x=>x==null||x===0?'-':Number(x).toLocaleString(undefined,{maximumFractionDigits:8});
async function load(){try{let a=await fetch('/api/analysis').then(r=>r.json()),d=await fetch('/api/demo/state').then(r=>r.json());$('sig').textContent=a.signal||'HOLD';$('sig').className='sig '+(a.signal||'HOLD').toLowerCase();$('reason').textContent=a.reason||a.error||'';$('pos').textContent=d.position==='LONG'?'خرید باز':'بدون معامله';$('price').textContent=f(a.price);$('entry').textContent=f(d.entry_price);$('pnl').textContent=f(d.total_pnl);$('tp').textContent=f(d.take_profit);$('sl').textContent=f(d.stop_loss);$('eq').textContent=f(d.equity);$('fee').textContent=f(d.fees);$('conf').textContent=(a.confidence??'-')+'%';$('rsi').textContent=a.rsi??'-';$('e20').textContent=f(a.ema20);$('e50').textContent=f(a.ema50);let rows=(d.trades||[]).slice().reverse();$('hist').innerHTML=rows.length?'<table><tr><th>نوع</th><th>قیمت</th><th>مقدار</th><th>سود/زیان</th><th>دلیل</th></tr>'+rows.map(t=>`<tr><td>${t.side==='BUY'?'خرید':'فروش'}</td><td>${f(t.price)}</td><td>${t.qty}</td><td>${f(t.pnl)}</td><td>${t.reason}</td></tr>`).join('')+'</table>':'هنوز معامله‌ای نیست.'}catch(e){$('msg').textContent='خطا: '+e}}
async function tick(){let r=await fetch('/api/demo/tick',{method:'POST'}).then(x=>x.json());$('msg').textContent=r.ok?'تیک Demo اجرا شد.':'خطا';load()}async function closeM(){await fetch('/api/demo/manual-close',{method:'POST'});$('msg').textContent='بستن دستی اجرا شد.';load()}async function resetD(){await fetch('/api/demo/reset',{method:'POST'});$('msg').textContent='Demo ریست شد.';load()}load();setInterval(load,10000)
</script>
